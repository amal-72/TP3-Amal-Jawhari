<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide touristique</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1, h2 {
            color: #263b5a;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 22px;
            padding: 12px 22px;
            background: #263b5a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #405d85;
        }

        .section {
            background: #f3f4f6;
            padding: 18px;
            margin-top: 20px;
            border-radius: 8px;
        }

        li {
            margin-bottom: 8px;
        }

        .token {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            font-weight: bold;
            color: #263b5a;
        }

        #message {
            margin-top: 15px;
            color: #b91c1c;
        }

        .loading {
            color: #263b5a;
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Guide touristique</h1>
    <p>Découvrez les endroits à visiter et le prix moyen d'un repas.</p>

    <label for="ville">Ville ou pays :</label>
    <input
            type="text"
            id="ville"
            placeholder="Exemple : Paris"
    >

    <label for="nombre">Nombre d'endroits :</label>
    <input
            type="number"
            id="nombre"
            value="2"
            min="1"
    >

    <button onclick="rechercher()">Rechercher</button>

    <p id="message"></p>

    <div id="resultat"></div>

</div>

<script>

    async function rechercher() {

        const ville = document.getElementById("ville").value.trim();
        const nombre = document.getElementById("nombre").value;

        const resultat = document.getElementById("resultat");
        const message = document.getElementById("message");

        resultat.innerHTML = "";
        message.textContent = "";

        if (!ville) {
            message.textContent = "Veuillez saisir une ville ou un pays.";
            return;
        }

        if (!nombre || Number(nombre) < 1 || !Number.isInteger(Number(nombre))) {
            message.textContent = "Veuillez saisir un nombre entier supérieur à zéro.";
            return;
        }

        const url = "api/guide/lieu/"
            + encodeURIComponent(ville)
            + "/"
            + nombre;

        try {

            message.textContent = "Recherche en cours...";
            message.className = "loading";

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("Erreur HTTP : " + response.status);
            }

            const data = await response.json();

            console.log("Réponse complète de l'API :", data);

            // Récupération des informations et des tokens
            const infos = data.informations ?? data;
            const usage = data.tokenUsage ?? data.token_usage ?? null;

            // Vérification du tableau des endroits
            const endroits = infos.endroits_a_visiter;

            if (!Array.isArray(endroits)) {
                message.textContent = "Le format des informations touristiques est inattendu.";
                resultat.innerHTML = `
                    <div class="section">
                        <h2>Réponse JSON reçue</h2>
                        <pre></pre>
                    </div>
                `;
                resultat.querySelector("pre").textContent =
                    JSON.stringify(data, null, 2);
                return;
            }

            message.textContent = "";

            // Affichage des informations touristiques
            resultat.innerHTML = `
                <div class="section">
                    <h2>Informations touristiques</h2>
                    <p><strong>Ville ou pays :</strong>
                        ${echapper(infos.ville_ou_pays ?? ville)}
                    </p>

                    <h3>Endroits à visiter</h3>
                    <ul id="listeEndroits"></ul>

                    <p><strong>Prix moyen d'un repas :</strong>
                        ${echapper(infos.prix_moyen_repas ?? "Non disponible")}
                    </p>
                </div>

                <div class="section">
                    <h2>Utilisation des tokens</h2>

                    <div class="token">
                        <span>Tokens d'entrée</span>
                        <strong>${usage?.inputTokenCount ?? "Non disponible"}</strong>
                    </div>

                    <div class="token">
                        <span>Tokens de sortie</span>
                        <strong>${usage?.outputTokenCount ?? "Non disponible"}</strong>
                    </div>

                    <div class="token total">
                        <span>Total des tokens</span>
                        <strong>${usage?.totalTokenCount ?? "Non disponible"}</strong>
                    </div>
                </div>
            `;

            // Ajout sécurisé des endroits
            const liste = document.getElementById("listeEndroits");

            endroits.forEach(lieu => {
                const li = document.createElement("li");
                li.textContent = lieu;
                liste.appendChild(li);
            });

        } catch (error) {

            message.className = "";
            message.textContent = "Erreur : " + error.message;

        }
    }

    function echapper(texte) {
        return String(texte)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

</script>

</body>
</html>
